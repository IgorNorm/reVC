name: Docker ARM Build
on: [push, workflow_dispatch]

jobs:
  build-reVC:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive # Важливо для коректного затягування librw

      - name: Build in ARM Docker
        uses: uraimo/run-on-arch-action@v2
        with:
          arch: armv7
          distro: bookworm
          githubToken: ${{ github.token }}
          
          # Встановлюємо залежності, включаючи ті, що необхідні для POSIX семафорів та звуку
          install: |
            apt-get update
            apt-get install -y build-essential cmake git libsdl2-dev libopenal-dev \
            libsndfile1-dev libmpg123-dev libglew-dev libglfw3-dev libpulse-dev

          # Додано -DRE3_POSIX=ON для виправлення помилки RE3_SEM_OPEN
          run: |
            mkdir -p build && cd build
            cmake .. \
              -DCMAKE_BUILD_TYPE=Release \
              -DRE3_POSIX=ON \
              -DREVC_AUDIO=OAL \
              -DLIBRW_PLATFORM=GL3 \
              -DLIBRW_GL3_GFXLIB=SDL2
            make -j$(nproc)

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: reVC-arm-v7-linux
          path: build/reVC
