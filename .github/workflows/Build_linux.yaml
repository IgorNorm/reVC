name: Docker ARM Build
on: [push, workflow_dispatch]

jobs:
  build-reVC:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build in ARM Docker
        uses: uraimo/run-on-arch-action@v2
        with:
          arch: armv7
          distro: bookworm
          githubToken: ${{ github.token }}
          
          # Встановлюємо залежності. libpthread-stubs-dev додано про всяк випадок
          install: |
            apt-get update
            apt-get install -y build-essential cmake git libsdl2-dev libopenal-dev \
            libsndfile1-dev libmpg123-dev libglew-dev libglfw3-dev libpthread-stubs0-dev

          # Використовуємо CMAKE_CXX_FLAGS для примусового визначення макросів семафорів
          run: |
            mkdir -p build && cd build
            cmake .. \
              -DCMAKE_BUILD_TYPE=Release \
              -DREVC_AUDIO=OAL \
              -DLIBRW_PLATFORM=GL3 \
              -DLIBRW_GL3_GFXLIB=SDL2 \
              -DCMAKE_CXX_FLAGS="-DRE3_POSIX -DRE3_SEM_OPEN=sem_open -DRE3_SEM_CLOSE=sem_close" \
              -DCMAKE_EXE_LINKER_FLAGS="-lpthread -lrt"
            
            make -j$(nproc)

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: reVC-arm-v7-linux
          path: build/reVC
